<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Patterns Hub — Master Interview Patterns</title>
    <meta name="description"
        content="A comprehensive, NeetCode-inspired DSA roadmap with 380+ curated problems across 20 patterns. Track your progress, master every pattern, ace the interview.">
    <meta name="keywords" content="DSA, Data Structures, Algorithms, Coding Interview, LeetCode, NeetCode, Patterns">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Noise texture overlay -->
    <div class="noise-overlay" aria-hidden="true"></div>

    <!-- Grid pattern overlay -->
    <div class="grid-overlay" aria-hidden="true"></div>

    <!-- ===== HEADER ===== -->
    <header class="app-header" id="appHeader">
        <div class="header-inner">
            <a href="#/" class="logo" id="logoLink">
                <span class="logo-icon">⬡</span>
                <span class="logo-text">DSA<span class="logo-accent">Hub</span></span>
            </a>

            <nav class="header-nav">
                <a href="#/" class="nav-link" data-nav="home">Roadmap</a>
                <a href="#/search" class="nav-link" data-nav="search">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    Search
                </a>
                <a href="#/randomizer" class="nav-link" data-nav="randomizer">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <circle cx="15.5" cy="15.5" r="1.5"></circle>
                        <circle cx="15.5" cy="8.5" r="1.5"></circle>
                        <circle cx="8.5" cy="15.5" r="1.5"></circle>
                        <circle cx="12" cy="12" r="1.5"></circle>
                    </svg>
                    Randomizer
                </a>
            </nav>

            <div class="header-actions">
                <div class="progress-pill" id="globalProgress">
                    <span class="progress-pill-count">0</span>/<span class="progress-pill-total">0</span> solved
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                    <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="app-main" id="appMain">
        <!-- Content rendered by JS -->
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="app-footer">
        <div class="footer-inner">
            <p>Built for interview prep · Problems sourced from <a href="https://leetcode.com" target="_blank"
                    rel="noopener">LeetCode</a> & <a href="https://www.geeksforgeeks.org" target="_blank"
                    rel="noopener">GeeksforGeeks</a></p>
            <button class="reset-btn" id="resetProgress">Reset All Progress</button>
        </div>
    </footer>

    <!-- GSAP & Draggable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>

    <script src="js/data.js"></script>
    <script src="js/data2.js"></script>
    <script src="js/data3.js"></script>
    <script src="js/data4.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cursors.js"></script>
</body>

</html>
